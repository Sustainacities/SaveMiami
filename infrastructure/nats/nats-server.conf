# NATS Server — AquaDome Core MVP
port: 4222
http_port: 8222

jetstream {
  store_dir: /tmp/nats-jetstream
  max_memory_store: 256MB
  max_file_store: 1GB
}

# Subjects used by AquaDome:
#   telemetry.frames     — vehicle telemetry fan-out
#   nest.events.*        — Hextronics dock events
#   ais.tracks           — AIS position reports
#   cot.events           — TAK CoT events
#   reports.generated    — report completion events
#   edge.heartbeat.*     — mesh node heartbeats
#   system.alerts        — system-wide alerts
